# Configuration pytest du backend.
# "pythonpath" ajoute ces dossiers au chemin de recherche des modules
# lors des tests. Les deux entrees couvrent tous les contextes :
# - "." : lancement depuis backend/ (rootdir = backend/)
# - "backend" : lancement depuis la racine du projet
#   (VS Code / IDE, dont le rootdir est la racine du depot)

[tool.pytest.ini_options]
pythonpath = [".", "backend"]
testpaths = ["tests"]
